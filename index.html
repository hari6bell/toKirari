<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きらりへ🤍</title>
  </head>
  <body>
    <!-- ログイン画面 -->
    <div id="login-page">
      <h1>🫶</h1>
      <div>
        <label for="email">ID</label><br>
        <input
          type="email"
          id="email">
      </div>
      <br>
      <div>
        <label for="password">愛のパスワード</label><br>
        <input
          type="password"
          id="password"
          placeholder="Password">
      </div>
      <br>
      <button id="loginButton">
        ログイン
      </button>
      <p id="message"></p>
    </div>

    <!-- ログイン後の画面 -->
     <div id = "content" style = "display: none;">
      <h1>きらりへ💌</h1>
      <br><br>
      <section id="counter-section">
      <p>💕付き合ってから　 <br><span id="elapsed-time">0日 0時間 0分 0秒</span>　で、</p>
      <p>💐 次の記念日まで　<br><span id="next-anniversary">あと0日</span>　だよん</p>
      </section>
      <h2>　[ 幸せステーション🖼️ ]</h2>
      <div id="photoGallery"></div>
      <br>

      <!-- メッセージ -->
      <section id="message-section">
      <h2>愛するきらりんへ 👚🐰🏊</h2>
      <!-- 1つ目のメッセージ -->
      <div id="message-display-1" class="message-display">
        メッセージ変えないと！
      </div>
      <h2>完璧な夫へ 🏎️🏋️‍♂️⚽</h2>
      <!-- 2つ目のメッセージ -->
      <div id="message-display-2" class="message-display">
        きらりの一言ほしいなぁ☺︎
      </div>
      <!-- 編集画面 -->
      <div id="message-edit" style="display: none;">
        <p>きらりへのメッセージ</p>
        <textarea id="message-input-1" rows="4"></textarea>
        <p>一太へのメッセージ</p>
        <textarea id="message-input-2" rows="4"></textarea>
        <br>
        <button id="saveMessageButton">💾 保存</button>
        <button id="cancelMessageButton">キャンセル</button>
      </div>
      <br>
      <button id="editMessageButton">✏️ コメントを編集</button>
      </section>

      <br>
      <p>写真追加して!!!</p>
      <input type="file" id="photoInput" accept="image/*">
      <button id="uploadButton">アップロード</button>
      <p id="uploadMessage"></p>
      <button id="deleteModeButton">🗑️ 写真を削除</button>
      <button id="deleteSelectedButton" style="display: none;">選択した写真を削除</button>


      <!-- ログアウトボタン -->
      <button id = "logoutButton">🔒 ログアウト</button>
      <br><br><br><br><br>
     </div>

     <script type="module" src="/src/main.js"></script>
  </body>
</html>

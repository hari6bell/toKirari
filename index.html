<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>きらりへ💌</title>
  </head>
  <body>
    <!-- ログイン画面 -->
    <div id="login-page">
      <h1>きらりへ💌</h1>
      <p>ぽちぽちっとログインしてねん</p>
      <div>
        <label for="email">めーるあどれしゅ</label><br>
        <input
          type="email"
          id="email">
      </div>
      <br>
      <div>
        <label for="password">愛のパスワード</label><br>
        <input
          type="password"
          id="password"
          placeholder="Password">
      </div>
      <br>
      <button id="loginButton">
        ログイン
      </button>
      <p id="message"></p>
    </div>

    <!-- ログイン後の画面 -->
     <div id = "content" style = "display: none;">
      <h1>きらりへ💌</h1>
      <p>よくログインできました！</p>
      <br><br><br><br><br><br>
      <p>ずっと下へいってね</p>
      <strong>すきです</strong>
      <hr>
      <h2>写真を追加</h2>
      <input type="file" id="photoInput" accept="image/*">
      <br><br>
      <button id="uploadButton">写真をアップロード</button>
      <p id="uploadMessage"></p>
      <br><br>
      <h2>お気に入りの写真</h2>
      <button id="deleteModeButton">🗑️ 写真を削除</button>
      <button id="deleteSelectedButton" style="display: none;">選択した写真を削除</button>
      <div id="photoGallery"></div>

      <!-- ログアウトボタン -->
       <button id = "logoutButton">
        ログアウト
       </button>
     </div>

     <script type="module" src="./src/main.js"></script>
  </body>
</html>
